{% load static %}
<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Budzet Domowy{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'expense_list' %}">Budzet Domowy</a>
        <nav>
            <a href="{% url 'expense_list' %}">Wydatki</a>
            <a class="button" href="{% url 'expense_create' %}">Dodaj wydatek</a>
        </nav>
    </header>

    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
